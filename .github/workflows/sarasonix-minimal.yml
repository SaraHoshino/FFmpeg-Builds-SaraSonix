name: SaraSonix Minimal FFmpeg

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILDKIT: 1

jobs:
  base:
    name: Build base image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: ./util/free_disk_space.sh

      - name: Install Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image name
        id: image
        shell: bash
        run: |
          IMG="${GITHUB_REPOSITORY,,}/base"
          IMG="${IMG// /-}"
          echo "name=ghcr.io/${IMG}" >> "$GITHUB_OUTPUT"

      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: images/base
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.image.outputs.name }}:cache
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:cache

  target-base:
    name: Build win64 base
    needs: base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: ./util/free_disk_space.sh

      - name: Install Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image name
        id: image
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${REPO}/base-win64" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"

      - name: Build win64 base
        uses: docker/build-push-action@v7
        with:
          context: images/base-win64
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.image.outputs.name }}:cache
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:cache
          build-args: |
            GH_REPO=${{ steps.image.outputs.repo }}

  downloads:
    name: Prepare dependency cache
    needs: base
    runs-on: ubuntu-latest

    outputs:
      cache-key: ${{ steps.key.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: ./util/free_disk_space.sh

      - name: Get cache key
        id: key
        run: echo "tag=$(./util/get_dl_cache_tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: sarasonix-downloads-${{ steps.key.outputs.tag }}
          restore-keys: |
            sarasonix-downloads-

      - name: Download dependencies
        run: |
          ./download.sh
          ./util/clean_cache.sh

  target:
    name: Build SaraSonix target
    needs:
      - target-base
      - downloads
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: ./util/free_disk_space.sh

      - name: Install Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: sarasonix-downloads-${{ needs.downloads.outputs.cache-key }}
          restore-keys: |
            sarasonix-downloads-

      - name: Generate SaraSonix Dockerfile
        run: ./generate.sh win64 lgpl-sarasonix-shared-8.1

      - name: Image name
        id: image
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${REPO}/win64-lgpl-sarasonix-shared-8.1" >> "$GITHUB_OUTPUT"

      - name: Build target image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.image.outputs.name }}:cache
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:cache

  ffmpeg:
    name: Build Windows x64 FFmpeg
    needs: target
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: ./util/free_disk_space.sh

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build FFmpeg
        run: ./build.sh win64 lgpl-sarasonix-shared-8.1

      - name: Upload SaraSonix FFmpeg
        uses: actions/upload-artifact@v7
        with:
          name: sarasonix-ffmpeg-win64
          path: artifacts/*
          if-no-files-found: error
